<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acervo Histórico Celeste - Sugerir Ídolo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-container">
      <h1>Acervo Histórico Celeste</h1>
      <nav>
        <ul>
          <li><a href="index.html">Galeria</a></li>
          <li><a href="sugerir.html" class="active">Sugerir Ídolo</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section>
      <h2 class="section-title">Sugira um Ídolo para o Acervo</h2>
      
      <div class="form-container">
        <form action="#" method="get">
          
          <div class="form-group">
            <label for="nomeJogador">Nome do Jogador:</label>
            <input type="text" id="nomeJogador" name="nomeJogador" required>
          </div>

          <div class="form-group">
            <label for="posicao">Posição:</label>
            <select id="posicao" name="posicao" required>
              <option value="" disabled selected>Selecione uma posição</option>
              <option value="goleiro">Goleiro</option>
              <option value="lateral">Lateral</option>
              <option value="zagueiro">Zagueiro</option>
              <option value="volante">Volante</option>
              <option value="meio_campista">Meio-campista</option>
              <option value="atacante">Atacante</option>
            </select>
          </div>

          <div class="form-group">
            <label for="anoEstreia">Ano de Estreia:</label>
            <input type="number" id="anoEstreia" name="anoEstreia" min="1921" max="2026" required>
          </div>

          <div class="form-group">
            <label for="justificativa">Justificativa:</label>
            <textarea id="justificativa" name="justificativa" minlength="20" placeholder="Escreva ao menos 20 caracteres explicando por que ele é um ídolo..." required></textarea>
          </div>

          <div class="form-group">
            <label for="nomeIndicador">Seu Nome (Quem indica):</label>
            <input type="text" id="nomeIndicador" name="nomeIndicador" required>
          </div>

          <div class="form-group">
            <label for="emailIndicador">Seu Email:</label>
            <input type="email" id="emailIndicador" name="emailIndicador" pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" required>
          </div>

          <button type="submit">Enviar Sugestão</button>
          
        </form>
      </div>
    </section>
  </main>

</body>
</html>
